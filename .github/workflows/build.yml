name: build

# Branch / PR pushes always build and upload a workflow artifact (90-day
# retention) so reviewers can download a flashable .bin without rebuilding
# locally. Tag pushes matching v* also create a GitHub Release with the same
# assets attached.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

# Cancel superseded runs on the same ref to keep the queue snappy. Tag runs
# never get cancelled (they may be the only path to a release artifact).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed only for the release job (tag pushes)
    strategy:
      fail-fast: false
      matrix:
        board: [supermini-c6, supermini-c3]
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # fetch-depth: 0 so `git describe` inside CMake can see all tags;
      # default shallow clone hides them.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Mirror what CMake's `git describe` will produce, so we can name
      # artifacts consistently.
      - id: version
        run: |
          VER=$(git describe --tags --dirty --always | sed 's/^v//')
          echo "FULL_VER=$VER" >> "$GITHUB_ENV"
          echo "version=$VER"   >> "$GITHUB_OUTPUT"
          echo "Building $VER for ${{ matrix.board }}"

      # Read board defaults the same way the local Makefile does so CI and
      # dev builds agree byte-for-byte. Each board file sets TARGET / LED_*.
      - id: board
        run: |
          # Strip Makefile syntax to plain shell exports.
          sed 's/?=/=/' boards/${{ matrix.board }}.mk > /tmp/board.env
          set -a; . /tmp/board.env; set +a
          echo "IDF_TARGET=esp32$TARGET"   >> "$GITHUB_ENV"
          echo "LED_ENABLE=$LED_ENABLE"     >> "$GITHUB_ENV"
          echo "LED_KIND=${LED_KIND:-1}"   >> "$GITHUB_ENV"
          echo "LED_GPIO=${LED_GPIO:-8}"   >> "$GITHUB_ENV"
          echo "LED_BRIGHTNESS=${LED_BRIGHTNESS:-10}" >> "$GITHUB_ENV"

      # Reuse the exact docker invocation from the local Makefile so CI
      # builds are bit-for-bit comparable with developer builds. Build dir
      # is per-target so the matrix jobs don't fight each other.
      - name: Build firmware
        run: |
          docker run --rm -v "$PWD:/project" -w /project \
            -e IDF_TARGET=$IDF_TARGET \
            -e EXTRA_CFLAGS="-DDD_TZ=\"CST-8\" -DDD_LED_ENABLE=$LED_ENABLE -DDD_LED_KIND=$LED_KIND -DDD_LED_GPIO=$LED_GPIO -DDD_LED_BRIGHTNESS=$LED_BRIGHTNESS" \
            espressif/idf:v6.0.1 \
            bash -c "git config --global --add safe.directory /project && idf.py -B build-$IDF_TARGET -DSDKCONFIG=sdkconfig.$IDF_TARGET reconfigure build"

      # Stage everything a fresh device needs to come up. The merged
      # `dingdong-merged.bin` is the easiest path for end users (single
      # esptool write_flash 0x0); the individual files are kept for anyone
      # using espflash with --bootloader / --partition-table. Filenames
      # carry the board name so a multi-board release doesn't collide.
      - name: Stage release assets
        run: |
          B=build-$IDF_TARGET
          BOARD=${{ matrix.board }}
          mkdir -p release
          cp $B/dingdong.bin                          "release/dingdong-${BOARD}-${FULL_VER}.bin"
          cp $B/bootloader/bootloader.bin             "release/bootloader-${BOARD}.bin"
          cp $B/partition_table/partition-table.bin   "release/partition-table-${BOARD}.bin"
          cp $B/ota_data_initial.bin                  "release/ota_data_initial-${BOARD}.bin"
          docker run --rm -v "$PWD:/project" -w /project \
            espressif/idf:v6.0.1 \
            python -m esptool --chip $IDF_TARGET merge-bin -o "release/dingdong-merged-${BOARD}-${FULL_VER}.bin" \
              0x0      $B/bootloader/bootloader.bin \
              0x8000   $B/partition_table/partition-table.bin \
              0x10000  $B/ota_data_initial.bin \
              0x20000  $B/dingdong.bin
          ls -lh release/

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.board }}-${{ env.FULL_VER }}
          path: release/
          retention-days: 90

      # Release only fires on tag pushes (v*). Auto-generated notes use
      # commit subjects between this tag and the previous one. Both matrix
      # jobs upload to the same release — softprops merges asset lists.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
