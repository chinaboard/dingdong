name: build

# Branch / PR pushes always build and upload a workflow artifact (90-day
# retention) so reviewers can download a flashable .bin without rebuilding
# locally. Tag pushes matching v* also create a GitHub Release with the same
# assets attached.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

# Cancel superseded runs on the same ref to keep the queue snappy. Tag runs
# never get cancelled (they may be the only path to a release artifact).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed only for the release job (tag pushes)
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # fetch-depth: 0 so `git describe` inside CMake can see all tags;
      # default shallow clone hides them.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Mirror what CMake's `git describe` will produce, so we can name
      # artifacts consistently.
      - id: version
        run: |
          VER=$(git describe --tags --dirty --always | sed 's/^v//')
          echo "FULL_VER=$VER" >> "$GITHUB_ENV"
          echo "version=$VER"   >> "$GITHUB_OUTPUT"
          echo "Building $VER"

      # Reuse the exact docker invocation from the local Makefile so CI
      # builds are bit-for-bit comparable with developer builds. CMake's
      # `git describe` runs inside the container against the mounted .git/.
      # safe.directory needed because container runs as a different uid than
      # the file owner on the GH runner.
      - name: Build firmware
        run: |
          docker run --rm -v "$PWD:/project" -w /project \
            -e EXTRA_CFLAGS='-DDD_TZ="CST-8" -DDD_LED_ENABLE=1 -DDD_LED_GPIO=8 -DDD_LED_BRIGHTNESS=10' \
            espressif/idf:v6.0.1 \
            bash -c "git config --global --add safe.directory /project && idf.py build"

      # Stage everything a fresh device needs to come up. The merged
      # `dingdong-merged.bin` is the easiest path for end users (single
      # esptool write_flash 0x0); the individual files are kept for anyone
      # using espflash with --bootloader / --partition-table.
      - name: Stage release assets
        run: |
          mkdir -p release
          cp build/dingdong.bin                          "release/dingdong-${FULL_VER}.bin"
          cp build/bootloader/bootloader.bin             release/bootloader.bin
          cp build/partition_table/partition-table.bin   release/partition-table.bin
          cp build/ota_data_initial.bin                  release/ota_data_initial.bin
          docker run --rm -v "$PWD:/project" -w /project \
            espressif/idf:v6.0.1 \
            python -m esptool --chip esp32c6 merge-bin -o "release/dingdong-merged-${FULL_VER}.bin" \
              0x0      build/bootloader/bootloader.bin \
              0x8000   build/partition_table/partition-table.bin \
              0x10000  build/ota_data_initial.bin \
              0x20000  build/dingdong.bin
          ls -lh release/

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ env.FULL_VER }}
          path: release/
          retention-days: 90

      # Release only fires on tag pushes (v*). Auto-generated notes use
      # commit subjects between this tag and the previous one.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
