<!doctype html>
<html lang='en'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<title>dingdong</title>
<style>
:root{
  color-scheme:dark;
  --bg:#08090A;
  --surface:#0F1011;
  --surface-2:#16171B;
  --border:rgba(255,255,255,.06);
  --border-strong:rgba(255,255,255,.12);
  --t1:#E6E6E7;
  --t2:#8A8F98;
  --t3:#5C616A;
  --accent:#8B98E6;
  --accent-bg:rgba(139,152,230,.08);
  --success:#4CB782;
  --success-bg:rgba(76,183,130,.10);
  --warning:#F1A45A;
  --warning-bg:rgba(241,164,90,.10);
  --danger:#E85F5F;
  --danger-bg:rgba(232,95,95,.10);
  --r:6px;
  --r-lg:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow-x:hidden}
body{
  font-family:-apple-system,'Inter',system-ui,sans-serif;
  font-size:13px;line-height:1.5;
  background:var(--bg);color:var(--t1);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
.mono{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-variant-numeric:tabular-nums}
button,input,select{font-family:inherit;font-size:13px;color:var(--t1)}
a{color:var(--accent);text-decoration:none}

.app{display:flex;flex-direction:column;height:100vh}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid var(--border);background:var(--bg);min-height:46px;flex-shrink:0}
.brand{font-weight:600;letter-spacing:-.01em;color:var(--t1);font-size:14px}
.brand .v{color:var(--t3);font-weight:400;margin-left:6px;font-size:11px}
.topbar .grow{flex:1}
.topbar .meta{color:var(--t2);font-size:12px}
.langsel{background:transparent;border:1px solid var(--border-strong);border-radius:var(--r);color:var(--t2);padding:3px 6px;font-size:11px;cursor:pointer}
.langsel:hover{color:var(--t1)}

.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;font-size:11px;font-weight:500;border-radius:999px;border:1px solid transparent;letter-spacing:.01em}
.badge.ok{color:var(--success);background:var(--success-bg);border-color:rgba(76,183,130,.20)}
.badge.warn{color:var(--warning);background:var(--warning-bg);border-color:rgba(241,164,90,.20)}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}

.body{flex:1;display:flex;overflow:hidden}
.sidebar{width:200px;border-right:1px solid var(--border);padding:16px 10px;flex-shrink:0;background:var(--bg)}
.navitem{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--r);color:var(--t2);cursor:pointer;font-size:13px;transition:background .12s,color .12s;user-select:none}
.navitem:hover{color:var(--t1);background:var(--surface)}
.navitem.active{color:var(--t1);background:var(--accent-bg);font-weight:500}

.main{flex:1;overflow-y:auto;padding:24px 32px}
.mainwrap{max-width:980px;margin:0 auto}

.mobiletabs{display:none}
/* Wizard mode (first-run setup + login): hide everything chrome-y, just show
   brand + lang switcher + the form itself. Status badge / clock / IP are all
   either uninitialised or irrelevant before the user finishes setup. */
body.wizard .sidebar,
body.wizard .mobiletabs,
body.wizard #healthBadge,
body.wizard .topbar .meta{display:none}
body.wizard .main{
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:max(8vh,40px) 24px 40px;
}
body.wizard .mainwrap{max-width:380px;width:100%;margin:0}
body.wizard .ph{text-align:center;margin-bottom:28px}
body.wizard .ph h1{font-size:22px;margin-bottom:6px}
body.wizard .card + .card{margin-top:14px}
/* Primary action in a wizard form should be full-width + centered. */
body.wizard .form .btn.primary{display:flex;width:100%;justify-content:center;padding:8px 12px}
@media (max-width:720px){
  .topbar{padding:10px 14px}
  .topbar .meta{display:none}
  .sidebar{display:none}
  .mobiletabs{display:flex;border-bottom:1px solid var(--border);background:var(--bg);padding:0 4px;overflow-x:auto;flex-shrink:0}
  .mobiletabs .navitem{border-radius:0;padding:10px 14px;border-bottom:2px solid transparent}
  .mobiletabs .navitem.active{background:transparent;color:var(--t1);border-bottom-color:var(--accent)}
  .main{padding:16px}
  .card{padding:14px 12px}
  /* Wide tables on narrow phones: scroll horizontally inside their wrapper
     div instead of overflowing into the page. Tables themselves stay real
     tables (so column alignment between rows survives) — only the wrapper
     gets overflow-x:auto. Cells get white-space:nowrap and the table goes
     width:auto so cell content actually pushes the table past wrapper
     width — without that, cells just wrap and the scroll never triggers. */
  #eventsList,#todayList,#calDay{overflow-x:auto;-webkit-overflow-scrolling:touch}
  #eventsList table,#todayList table,#calDay table{width:auto;min-width:100%}
  #eventsList th,#eventsList td,
  #todayList th,#todayList td,
  #calDay th,#calDay td{white-space:nowrap}
  /* IP / MAC / hostnames in kv dd's mustn't push the column off-screen. */
  .kv dd{word-break:break-all}
  /* Long-running input + button rows (worker edit, change pw, OTA, etc.)
     wrap by default so nothing ends up half-clipped. */
  .card .row{flex-wrap:wrap}
  /* Inputs inside wrapping card rows should each take their own line on
     mobile — without this, two `flex:1` inputs on the same row each end
     up ~half-width (≈100px), too narrow to read placeholders like
     "New password (≥8 chars)". */
  .card .row > .input{flex-basis:100%;min-width:0}
  /* Worker-filter select in attendance has `min-width:140px` inline; relax
     it so it doesn't bully the buttons next to it on narrow phones. */
  #workerFilter{min-width:0!important}
  /* iOS Safari auto-zooms when a tapped input is smaller than 16px,
     producing a jarring "page shifted" sensation. Bump inputs to 16px on
     mobile to prevent it. */
  .input,select.input{font-size:16px}
}
@media (max-width:420px){
  .topbar{padding:8px 10px;gap:8px}
  /* Version string can be long ("0.6.1+20260428.1746" or
     "0.6.1-3-gabc1234-dirty") — push it offscreen rather than have it
     fight badge + lang switcher for the topbar. Available in /diag if
     anyone needs it from a phone. */
  .brand .v{display:none}
  /* Health badge worst-case "BLE, WiFi, NTP, No WiFi" can push the lang
     switcher off-screen. Cap + ellipsis instead. */
  #healthBadge{max-width:140px;min-width:0}
  #healthText{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .stats{grid-template-columns:1fr}
  .stats .stat:nth-child(3){grid-column:auto}
  .ph h1{font-size:18px}
  .ph .desc{font-size:12px}
  .cal{gap:2px}
  .cal .h{font-size:9px;padding:2px 0}
  .calcell .d{font-size:9px}
  .calcell .n{font-size:10px}
  /* Worker row gets its own treatment: name input goes full-width on its
     own line, category right under it. Avoids the "name field 60px wide"
     mess when 6 elements try to share a 320px row. */
  .w-name{flex:1 0 100%;min-width:0}
  .w-cat{flex:1 0 100%;max-width:none}
}

.ph{margin:0 0 24px}
.ph h1{font-size:20px;margin:0 0 4px;font-weight:600;letter-spacing:-.01em}
.ph .desc{color:var(--t2);font-size:13px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px}
.card + .card{margin-top:12px}
.card h2{font-size:14px;margin:0 0 8px;font-weight:600;letter-spacing:-.01em}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px}
.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);font-weight:500}
.stat .v{font-size:24px;margin-top:6px;font-weight:600;letter-spacing:-.02em}
.stat .v .unit{font-size:12px;color:var(--t3);font-weight:400;margin-left:4px;letter-spacing:0}
.stat .sub{font-size:11px;color:var(--t2);margin-top:4px}
@media (max-width:560px){.stats{grid-template-columns:1fr 1fr}.stats .stat:nth-child(3){grid-column:span 2}}

.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;font-size:12px;font-weight:500;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:var(--r);color:var(--t1);cursor:pointer;transition:background .12s,border-color .12s}
.btn:hover{background:#1F2026;border-color:rgba(255,255,255,.18)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#9AA6EE;border-color:#9AA6EE}
.btn.ghost{background:transparent;border-color:transparent;color:var(--t2)}
.btn.ghost:hover{color:var(--t1);background:var(--surface)}
.btn.danger{color:var(--danger);border-color:rgba(232,95,95,.30)}
.btn.danger:hover{background:var(--danger-bg);border-color:var(--danger)}
.btn.sm{padding:4px 8px;font-size:11px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
/* Primary submit at the bottom of a stacked .form (login, setup, change pw):
   extra top margin + centered text without an inline style. */
.form .btn.submit{margin-top:6px;justify-content:center}

.input,select.input{background:var(--bg);border:1px solid var(--border-strong);border-radius:var(--r);padding:6px 10px;color:var(--t1);outline:none;transition:border-color .12s;font-size:13px}
.input:focus{border-color:var(--accent)}
.input::placeholder{color:var(--t3)}
/* Worker-row inputs: name takes remaining width, category is fixed-narrow.
   Defined as classes (not inline style=) so the mobile media query can
   actually override them — inline styles outrank media-query selectors. */
.w-name{flex:1;min-width:120px}
.w-cat{max-width:100px}

.form{display:flex;flex-direction:column;gap:10px}
.form label{font-size:12px;color:var(--t2);display:flex;flex-direction:column;gap:4px}

.row{display:flex;gap:8px;align-items:center}
.row.between{justify-content:space-between}
.grow{flex:1}

table{width:100%;border-collapse:collapse;font-size:12px}
table th{text-align:left;font-weight:500;color:var(--t3);padding:8px 10px;border-bottom:1px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
table td{padding:9px 10px;border-bottom:1px solid var(--border);color:var(--t1)}
table tr:last-child td{border-bottom:0}
table tr:hover td{background:var(--surface-2)}
.t-mute{color:var(--t2)}
.t-pos{color:var(--success)}
.t-neg{color:var(--danger)}
.evtype{display:inline-block;padding:1px 7px;border-radius:4px;font-size:11px;font-weight:500;letter-spacing:.02em}
.evtype.in{color:var(--success);background:var(--success-bg)}
.evtype.out{color:var(--danger);background:var(--danger-bg)}
.empty{color:var(--t3);text-align:center;padding:24px 12px;font-size:12px}

.barwrap{height:4px;background:var(--bg);border-radius:99px;overflow:hidden;margin-top:8px}
.bar{height:100%;background:var(--success);transition:width .3s,background .3s}
.bar.warn{background:var(--warning)}
.bar.full{background:var(--danger)}

.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:12px}
.kv dt{color:var(--t3);text-align:left}
.kv dd{margin:0;color:var(--t1);text-align:right;font-variant-numeric:tabular-nums}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;font-size:11px}
.cal .h{color:var(--t3);text-align:center;padding:4px 0;font-weight:500}
.calcell{aspect-ratio:1;border-radius:4px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:default;border:1px solid transparent;transition:border-color .12s,background .12s}
.calcell.has{background:rgba(139,152,230,.10);cursor:pointer}
.calcell.has:hover{border-color:var(--accent)}
.calcell .d{color:var(--t2);font-size:10px}
.calcell .n{color:var(--t1);font-size:11px;font-weight:500;margin-top:1px}
.calcell.has .n{color:var(--accent)}

.passkey{font-family:ui-monospace,Menlo,monospace;font-size:32px;font-weight:600;letter-spacing:.16em;color:var(--accent);text-align:center;padding:12px;background:var(--bg);border-radius:var(--r);border:1px dashed var(--border-strong)}

.otabar{height:4px;background:var(--bg);border-radius:99px;overflow:hidden;margin-top:8px}
.otabar .fill{height:100%;background:var(--accent);transition:width .15s}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:640px){.tiles{grid-template-columns:1fr 1fr}}
@media (max-width:380px){.tiles{grid-template-columns:1fr}}
.tile{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;min-height:110px}
.tile .k{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);font-weight:500;margin-bottom:6px}
.tile .v{font-size:16px;color:var(--t1);font-weight:600;line-height:1.25;letter-spacing:-.01em}
.tile .v .u{font-size:11px;color:var(--t3);font-weight:400;margin-left:3px;letter-spacing:0}
.tile .sub{font-size:11px;color:var(--t2);margin-top:3px;line-height:1.4}
.tile .sub.mono{font-family:ui-monospace,Menlo,monospace}
.tile .barwrap{margin-top:7px;height:3px}
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:'▸ ';color:var(--t3);transition:transform .12s;display:inline-block}
details[open]>summary::before{content:'▾ '}

/* System tab section grouping. Replaces the old single-column wall-of-cards
   with header-separated sections; small settings cards pair up two-per-row
   on wide screens, stack on mobile. */
.section{display:flex;flex-direction:column;gap:2px;margin:24px 4px 10px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.section:first-child{margin-top:0}
.section .h{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--t2);font-weight:600}
.section .d{font-size:11px;color:var(--t3);font-weight:400}
.s-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:720px){.s-grid{grid-template-columns:1fr}}
.s-grid > .card{margin-top:0}

/* Card header convention: every card titles itself with .ctitle (small uppercase
   muted, like .label). Optional .cdesc sits directly under for a 1-line hint.
   Replaces the historical mix of <h2> + inline-styled descriptions. */
.ctitle{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);font-weight:600;margin:0 0 4px}
.cdesc{font-size:11px;color:var(--t2);margin:0 0 12px;line-height:1.5}
.cdesc:last-child{margin-bottom:0}

/* Segmented control — two/three-way exclusive tabs that look like a pill.
   Used in attendance for Raw/Sessions view switch. */
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--border-strong);border-radius:var(--r);padding:2px;gap:0}
.seg button{background:transparent;border:0;padding:5px 12px;font-size:12px;color:var(--t2);border-radius:4px;cursor:pointer;font-weight:500}
.seg button.on{background:var(--surface-2);color:var(--t1);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.seg button:hover:not(.on){color:var(--t1)}

/* Icon-only button for topbar (logout). Square, transparent, matches langsel
   visual weight without inheriting its select styling. */
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;background:transparent;border:1px solid var(--border-strong);border-radius:var(--r);color:var(--t2);cursor:pointer;font-size:12px;padding:0}
.iconbtn:hover{color:var(--t1);border-color:rgba(255,255,255,.18)}

/* Worker row: name + category on top, meta + actions below (mobile-friendly). */
.wrow{padding:10px 0;border-bottom:1px solid var(--border)}
.wrow:last-child{border-bottom:0}
.wrow-meta{font-family:ui-monospace,Menlo,monospace;font-size:10px;color:var(--t3);margin-top:6px;font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.wrow-meta .sep{color:var(--border-strong)}
</style>
</head>
<body>

<div class=app>
  <header class=topbar>
    <div class=brand>dingdong<span class=v id=fwVer>?</span></div>
    <div id=healthBadge class='badge'><span class=dot></span><span id=healthText>…</span></div>
    <div class=grow></div>
    <div class=meta>
      <span class=mono id=clock>—</span>
    </div>
    <select id=langSel class=langsel>
      <option value=en>EN</option>
      <option value=zh>中文</option>
    </select>
    <button id=topLogoutB class=iconbtn style='display:none' title='Log out'>⏻</button>

  <div class=body>

function pickLang(){
  const stored=localStorage.getItem('dd_lang');
  if(stored && I18N[stored]) return stored;
  const nav=(navigator.language||'en').toLowerCase();
  if(nav.startsWith('zh')) return 'zh';
  return 'en';
}
let LANG=pickLang();
document.documentElement.lang = LANG==='zh' ? 'zh-CN' : 'en';
function t(key, ...args){
  const dict=I18N[LANG]||I18N.en;
  let s = dict[key];
  if(s===undefined) s = I18N.en[key];
  if(s===undefined) return key;  // missing key surfaces visibly in dev
  for(let i=0;i<args.length;i++) s = s.replace(new RegExp('\\{'+i+'\\}','g'), args[i]);
  return s;
}

const NAV=[
  {id:'overview',k:'nav.overview'},
  {id:'attendance',k:'nav.attendance'},
  {id:'people',k:'nav.people'},
  {id:'system',k:'nav.system'},
];
let state={view:'overview',workers:[],workersById:{},pairedMode:false,authed:false,setupMode:false,status:null,logsTimer:null};

function renderNav(host,active){
  host.innerHTML='';
  for(const n of NAV){
    const el=document.createElement('div');
    el.className='navitem'+(n.id===active?' active':'');
    el.textContent=t(n.k);
    el.onclick=()=>{state.view=n.id;localStorage.setItem('dd_view',n.id);render();};
    host.appendChild(el);
  }
}

function fmtBytes(n){if(!n||n<0)return '–';
  if(n<1024)return n+' B';
  if(n<1048576)return (n/1024).toFixed(1)+' KB';
  return (n/1048576).toFixed(2)+' MB';}
function fmtDur(s){if(!s&&s!==0)return '-';
  const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),ss=Math.floor(s%60);
  if(d>0)return `${d}d ${h}h`;if(h>0)return `${h}h ${m}m`;if(m>0)return `${m}m ${ss}s`;return ss+'s';}
function fmtTs(t){if(!t)return '-';const d=new Date(t*1000);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;}
function fmtTime(ts){if(!ts)return '-';const d=new Date(ts*1000);
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;}
function fmtRel(ts){if(!ts)return '-';const s=Math.floor(Date.now()/1000)-ts;
  if(s<60)return t('rel.s',s);
  if(s<3600)return t('rel.m',Math.floor(s/60));
  if(s<86400)return t('rel.h',Math.floor(s/3600));
  if(s<604800)return t('rel.d',Math.floor(s/86400));
  return fmtTs(ts);}
function escAttr(s){return String(s||'').replace(/'/g,'&apos;').replace(/</g,'&lt;')}

const _origFetch=window.fetch.bind(window);
window.fetch=async(url,opts)=>{
  const r=await _origFetch(url,opts);
  if(r.status===401 && typeof url==='string' && !url.startsWith('/api/auth/')){
    if(state.authed){state.authed=false;render();}
  }
  return r;
};

async function refreshStatus(){
  const r=await fetch('/api/system/status').then(r=>r.json()).catch(()=>null);
  if(!r)return null;
  if(r.version)$('fwVer').textContent='v'+r.version;
  if(r.now_unix){const d=new Date(r.now_unix*1000);
    $('clock').textContent=`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;}
  const issues=[];
  if(!r.ble_advertising)issues.push(t('issue.ble'));
  if(!(r.wifi==='AP'||r.wifi==='STA_GOT_IP'))issues.push(t('issue.wifi'));
  if(!r.ntp_synced&&r.wifi==='STA_GOT_IP')issues.push(t('issue.ntp'));
  if(r.has_admin&&!r.has_wifi_creds)issues.push(t('issue.no_wifi'));
  const b=$('healthBadge');
  if(issues.length===0){b.className='badge ok';$('healthText').textContent=t('health.healthy');}
  else{b.className='badge warn';$('healthText').textContent=issues.join(', ');}
  state.status=r;
  state.setupMode=!r.has_admin||!r.has_wifi_creds;
  return r;
}

async function refreshAuth(){
  if(state.setupMode)return false;
  const r=await fetch('/api/auth/me');
  state.authed=r.ok;
  return r.ok;
}

async function init(){
  $('langSel').value=LANG;
  $('langSel').onchange=()=>{
    LANG=$('langSel').value;
    localStorage.setItem('dd_lang',LANG);
    document.documentElement.lang = LANG==='zh' ? 'zh-CN' : 'en';
    refreshStatus().then(render);
  };
  $('topLogoutB').onclick=async()=>{
    await fetch('/api/auth/logout',{method:'POST'});
    state.authed=false;render();
  };
  const v=localStorage.getItem('dd_view');
  if(v&&NAV.find(n=>n.id===v))state.view=v;
  await refreshStatus();
  await refreshAuth();
  render();
  setInterval(async()=>{await refreshStatus();
    if(state.view==='overview'&&state.authed)refreshOverviewLite();
  },5000);
}

function render(){
  const wizard = state.setupMode || !state.authed;
  document.body.classList.toggle('wizard', wizard);
  $('topLogoutB').style.display = wizard ? 'none' : '';
  // Tear down auto-refresh timers when navigating away from System tab.
  if(state.view!=='system' && state.logsTimer){clearInterval(state.logsTimer);state.logsTimer=null;}
  if (wizard) {
    // No nav in wizard mode — clear stale tab content if rendered earlier.
    $('sidebar').innerHTML = '';
    $('mobiletabs').innerHTML = '';
    if(state.setupMode){renderSetup();return;}
    renderLogin();return;
  }
  renderNav($('sidebar'),state.view);
  renderNav($('mobiletabs'),state.view);
  if(state.view==='overview')renderOverview();
  else if(state.view==='attendance')renderAttendance();
  else if(state.view==='people')renderPeople();
  else if(state.view==='system')renderSystem();
}

    const inNow=ws.filter(w=>w.currently_in).length;
    const totalSegs=ws.reduce((a,w)=>a+w.segments,0);
    const bondsR=await fetch('/api/bonds').then(r=>r.json()).catch(()=>({count:0}));
    $('statsRow').innerHTML=`

    if(ws.length===0){$('todayList').innerHTML=`<div class=empty>${t('overview.no_today')}</div>`;}
    else{
      $('todayList').innerHTML=`<table>
        <thead><tr><th>${t('overview.col_worker')}</th><th>${t('overview.col_sessions')}</th><th>${t('overview.col_total')}</th><th>${t('overview.col_status')}</th></tr></thead>

          <td>${w.segments}</td>
          <td class=mono>${fmtDur(w.total_seconds)}</td>
          <td>${w.currently_in?`<span class=t-pos>${t('overview.on_site')}</span>`:`<span class=t-mute>${t('overview.left')}</span>`}</td>
        </tr>`).join('')}</tbody></table>`;
    }
  }

  const cd=await fetch('/api/calendar?days=30').then(r=>r.json()).catch(()=>null);
  if(cd){
    const buckets={};(cd.buckets||[]).forEach(b=>buckets[b.date_unix]=b);
    const dayMs=86400000,fromMs=cd.from_unix*1000;
    const wkdays=t('cal.weekdays').split(',');
    let h='<div class=cal>'+wkdays.map(d=>`<div class=h>${d}</div>`).join('');
    const startWkd=new Date(fromMs).getDay();
    for(let i=0;i<startWkd;i++)h+='<div></div>';
    for(let i=0;i<cd.days;i++){
      const dt=new Date(fromMs+i*dayMs);
      const localMid=Math.floor(new Date(dt.getFullYear(),dt.getMonth(),dt.getDate()).getTime()/1000);
      const b=buckets[localMid],ev=b?b.events:0;
      const ds=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;

    $('calBox').innerHTML=h;
    document.querySelectorAll('.calcell.has').forEach(c=>c.onclick=()=>loadCalDay(c.dataset.date));
  }
}

    const evs=(r.events||[]).slice().reverse();

    $('eventsList').innerHTML=`<table><thead><tr><th>${t('overview.col_time')}</th><th>${t('overview.col_type')}</th><th>${t('overview.col_worker')}</th><th>${t('overview.col_source')}</th><th>${t('attendance.col_note')}</th><th></th></tr></thead>

    document.querySelectorAll('.evDel').forEach(b=>b.onclick=async()=>{

function pollPair(){
  const box=$('pairBox');
  let confirming=false;
  const finish=()=>{
    if($('pairB')){$('pairB').disabled=false;}
    loadWorkers();
  };
  const tick=async()=>{
    if(confirming){setTimeout(tick,500);return;}
    const s=await fetch('/api/pairing/status').then(r=>r.json()).catch(()=>({active:false}));
    if(!s.active){box.innerHTML=`<div class="t-mute" style="font-size:12px;margin-top:8px">${t('people.window_closed')}</div>`;finish();return;}
    const sec=Math.ceil(s.remaining_ms/1000);
    const dev=state.status?.ble||'dingdong-XXXX';
    if(s.numcmp&&s.numcmp>0){
      box.innerHTML=`<div class=passkey>${String(s.numcmp).padStart(6,'0')}</div>
        <div class='t-mute' style='font-size:12px;text-align:center;margin-top:10px'>
          ${t('people.numcmp_l1_html')}<br>
          ${t('people.numcmp_l2_html')}

        <div class=row style='justify-content:center;margin-top:12px'>
          <button class='btn ghost sm' id=cancelB>${t('people.cancel_pair')}</button>
        </div>`;
      $('cancelB').onclick=async()=>{await fetch('/api/pairing/cancel',{method:'POST'});box.innerHTML='';finish();};
    }else{
      box.innerHTML=`<div style='text-align:center;padding:18px 0'>
        <div style='font-size:14px;color:var(--t1)'>${t('people.tap_html',dev)}</div>
        <div class='t-mute' style='font-size:12px;margin-top:8px'>${t('people.after_connect')}</div>
        <div class='t-mute' style='font-size:11px;margin-top:6px'>${t('people.remaining',sec)}</div>
      </div>
      <div class=row style='justify-content:center;margin-top:8px'>
        <button class='btn ghost sm' id=cancelB>${t('people.cancel_pair')}</button>
      </div>`;
      $('cancelB').onclick=async()=>{await fetch('/api/pairing/cancel',{method:'POST'});box.innerHTML='';finish();};
    }
    setTimeout(tick,1000);
  };
  tick();
}

        <span>id=${w.id}</span><span class=sep>·</span>
        <span>${w.addr}</span><span class=sep>·</span>
        <span>${w.bonded?`<span class=t-pos>${t('people.bonded')}</span>`:`<span class=t-mute>${t('people.not_bonded')}</span>`}</span>
      </div>
    </div>`).join('');
  document.querySelectorAll('.saveW').forEach(b=>b.onclick=async()=>{
    const id=+b.dataset.id;
    const inputs=document.querySelectorAll(`input[data-id='${id}']`);
    const body={id};inputs.forEach(i=>body[i.dataset.field]=i.value);
    const r=await fetch('/api/workers/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(r.ok){b.textContent='✓';setTimeout(()=>b.textContent=t('common.save'),1000);}else alert(t('common.failed'));});
  document.querySelectorAll('.punchW').forEach(b=>b.onclick=async()=>{
    const id=+b.dataset.id,type=b.dataset.type;
    const note=prompt(t('people.note_prompt'),'')||'';
    const r=await fetch('/api/events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({worker_id:id,type,note:note||'web manual'})});
    if(r.ok){b.textContent='✓';setTimeout(()=>b.textContent=type==='in'?t('people.in'):t('people.out'),900);}else alert(t('common.failed'));});
  document.querySelectorAll('.revokeW').forEach(b=>b.onclick=async()=>{
    if(!confirm(t('people.delete_confirm')))return;
    await fetch('/api/workers/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:+b.dataset.id})});
    loadWorkers();});
}

    <div class=section>

    </div>
    <div class=card>
      <div class=ctitle>${t('system.ota_label')}</div>
      <div class=cdesc>${t('system.ota_desc',state.status?.version||'?')}</div>
      <div class=row>
        <input type=file id=otaFile accept='.bin' class=input style='flex:1'>

    <div class=section>
      <div class=h>${t('system.section_diagnostics')}</div>
      <div class=d>${t('system.section_diagnostics_desc')}</div>
    </div>
    <div class=card>
      <div id=diagTiles class=tiles>${t('common.loading')}</div>
    </div>
    <div class=card>
      <div class=ctitle>${t('logs.title')}</div>
      <div class=cdesc>${t('logs.desc')}</div>
      <pre id=logsBox class=mono style='background:var(--bg);padding:10px;border-radius:var(--r);overflow:auto;max-height:280px;font-size:11px;color:var(--t2);margin:0;white-space:pre-wrap;word-break:break-all'>${t('common.loading')}</pre>
      <div class=row style='margin-top:10px;flex-wrap:wrap;gap:8px'>
        <button class='btn ghost sm' id=logsRefresh title='${t('common.refresh')}'>↻</button>
        <label class='row' style='gap:6px;cursor:pointer;user-select:none;font-size:12px;color:var(--t2)'>
          <input type=checkbox id=logsAuto>
          <span>${t('logs.auto')}</span>
        </label>
        <div class=grow></div>

      </div>
    </div>

    <div class=section>
      <div class=h>${t('system.section_danger')}</div>
      <div class=d>${t('system.section_danger_desc')}</div>
    </div>
    <div class=card>
      <div class=row style='flex-wrap:wrap;gap:8px'>
        <button class='btn ghost' id=restartB>${t('system.restart')}</button>
        <button class='btn ghost sm danger' id=metricsResetB>${t('system.reset_stats')}</button>

  $('logsAuto').onchange=()=>{

    if($('logsAuto').checked){state.logsTimer=setInterval(loadLogs,2000);}
  };
  $('logsClear').onclick=async()=>{
    const r=await fetch('/api/system/logs/clear',{method:'POST'});
    if(r.ok)loadLogs(); else alert(t('common.failed'));
  };
  fetch('/api/system/device_name').then(r=>r.json()).then(d=>{$('nameInput').value=d.name||'';});
  fetch('/api/system/led').then(r=>r.json()).then(d=>{
    const cb=$('ledToggle');if(!cb)return;
    cb.checked=!!d.enabled; cb.disabled=false;
    cb.onchange=async()=>{
      cb.disabled=true;
      const r=await fetch('/api/system/led',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:cb.checked})});
      cb.disabled=false;
      if(!r.ok){cb.checked=!cb.checked;alert(t('common.failed'));}
    };
  });
  fetch('/api/system/presence_timeout').then(r=>r.json()).then(d=>{
    const inp=$('presenceTimeout');if(!inp)return;
    inp.value=d.timeout_s||60;
  });
  $('presenceSaveB').onclick=async e=>{
    const v=parseInt($('presenceTimeout').value,10);
    if(!(v>=30&&v<=600)){alert('30 - 600');return;}
    const r=await fetch('/api/system/presence_timeout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({timeout_s:v})});
    if(r.ok){e.target.textContent='✓';setTimeout(()=>e.target.textContent=t('common.save'),1000);}
    else alert(t('common.failed'));
  };
  fetch('/api/system/ntp_server').then(r=>r.json()).then(d=>{
    if($('ntpServer'))$('ntpServer').value=d.server||'';
    if($('ntpStatus'))$('ntpStatus').textContent=
      d.synced ? t('system.ntp_synced', d.last_sync_unix?fmtRel(d.last_sync_unix):'?')
               : t('system.ntp_unsynced');
  });
  $('ntpSaveB').onclick=async e=>{
    const v=$('ntpServer').value.trim();
    if(!v){alert(t('common.failed'));return;}

  $('metricsResetB').onclick=async e=>{

  };
  $('nameSaveB').onclick=async e=>{
    const name=$('nameInput').value.trim();if(!name)return;
    const r=await fetch('/api/system/device_name',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});

    else alert(t('common.failed_prefix')+' '+await r.text());};
  $('changePwB').onclick=async()=>{
    const o=$('oldPw').value,n=$('newPw').value;
    if(!o||n.length<8){alert(t('system.pw_required'));return;}
    const r=await fetch('/api/auth/change_password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({old_password:o,new_password:n})});
    if(r.ok){alert(t('system.pw_changed'));await fetch('/api/auth/logout',{method:'POST'});state.authed=false;render();}
    else alert(t('common.failed_prefix')+' '+await r.text());};
  $('restartB').onclick=async()=>{if(!confirm(t('system.restart_confirm')))return;
    await fetch('/api/system/restart',{method:'POST'});waitForReboot();};
  $('factoryB').onclick=async()=>{
    if(!confirm(t('system.factory_confirm')))return;
    const r=await fetch('/api/system/factory_reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({confirm:'FACTORY_RESET'})});
    if(r.ok)waitForReboot();else alert(t('common.failed_prefix')+' '+await r.text());};
  $('otaB').onclick=async()=>{
    const f=$('otaFile').files[0];if(!f){alert(t('system.pick_bin'));return;}
    if(!confirm(t('system.ota_confirm',(f.size/1024).toFixed(0))))return;
    $('otaB').disabled=true;
    $('otaBarWrap').style.display='block';
    const xhr=new XMLHttpRequest();
    xhr.open('POST','/api/system/ota');xhr.setRequestHeader('Content-Type','application/octet-stream');
    xhr.upload.onprogress=e=>{
      if(e.lengthComputable){const pct=Math.floor(e.loaded*100/e.total);
        $('otaBar').style.width=pct+'%';
        $('otaProgress').textContent=t('system.ota_progress',pct,(e.loaded/1024).toFixed(0),(e.total/1024).toFixed(0));}
    };
    xhr.onload=()=>{const ok=xhr.status>=200&&xhr.status<300;
      $('otaProgress').textContent=ok?'✓ '+xhr.responseText:t('common.failed_prefix')+' '+xhr.status+': '+xhr.responseText;
      if(ok)waitForReboot();$('otaB').disabled=false;};
    xhr.onerror=()=>{$('otaProgress').textContent=t('system.ota_net_err');$('otaB').disabled=false;};
    xhr.send(f);
  };
  $('ghCheckB').onclick=async()=>{
    const cb=$('ghCheckB'),pb=$('ghPullB'),st=$('ghStatus');
    cb.disabled=true; cb.textContent=t('system.gh_checking'); st.textContent='';
    pb.style.display='none';
    try{
      const r=await fetch('/api/system/ota_check');
      if(!r.ok){st.textContent=t('system.gh_check_failed',await r.text()); return;}
      const d=await r.json();
      const cur='v'+(state.status?.version||'?').split('-')[0];
      const newer = d.tag !== cur;
      if(newer){
        st.textContent=t('system.gh_newer', d.tag, state.status?.version||'?', fmtRel(Math.floor(new Date(d.published_at).getTime()/1000)));
        pb.textContent=t('system.gh_pull', d.tag);
        pb.style.display='';
        pb.dataset.tag=d.tag;
        pb.dataset.bytes=d.asset_bytes;
      } else {
        st.textContent=t('system.gh_uptodate', d.tag);
      }
    } catch(_){ st.textContent=t('system.gh_check_failed','network'); }
    finally { cb.disabled=false; cb.textContent=t('system.gh_check'); }
  };
  $('ghPullB').onclick=async()=>{
    const pb=$('ghPullB'),st=$('ghStatus');
    const tag=pb.dataset.tag, bytes=pb.dataset.bytes;
    if(!confirm(t('system.gh_pull_confirm', tag, (bytes/1024).toFixed(0))))return;
    pb.disabled=true; pb.textContent=t('system.gh_pulling');
    st.textContent='';
    try{
      const r=await fetch('/api/system/ota_pull',{method:'POST'});
      if(r.status===202){
        // Server accepted, runs in background. Poll for reboot.
        st.textContent=t('system.gh_pulling');
        waitForReboot();
      } else {
        st.textContent=t('common.failed_prefix')+' '+await r.text();
        pb.disabled=false; pb.textContent=t('system.gh_pull', tag);
      }
    } catch(_){
      st.textContent=t('system.ota_net_err');
      pb.disabled=false; pb.textContent=t('system.gh_pull', tag);
    }
  };
}

async function loadDiag(){
  const r=await fetch('/api/system/diag').then(r=>r.json()).catch(()=>null);
  if(!r){$('diagTiles').innerHTML=`<div class=empty>${t('common.load_failed')}</div>`;return;}
  const fw=r.firmware||{},chip=r.chip||{},heap=r.heap||{},fs=r.fs||{},m=r.metrics||{},ota=r.ota||{};
  const fsPct=fs.total?Math.round((fs.used||0)*100/fs.total):0;
  const fsCls=fsPct>90?'full':(fsPct>70?'warn':'');
  $('diagTiles').innerHTML=`
    <div class=tile>
      <div class=k>${t('diag.firmware')}</div>
      <div class=v>v${fw.version||'?'}</div>
      <div class=sub>${t('diag.idf')} ${fw.idf_ver||'?'}</div>
      <div class='sub mono'>${fw.compile_date||''} ${fw.compile_time||''}</div>
    </div>
    <div class=tile>
      <div class=k>${t('diag.chip')}</div>
      <div class=v>${chip.model||'?'}</div>
      <div class=sub>${t('diag.rev')} ${chip.rev_major||0}.${chip.rev_minor||0} · ${chip.cores||0} ${t('diag.cores')}</div>
      <div class=sub>${t('diag.reset_reason')} <span class=mono>${r.reset_reason||'-'}</span></div>
    </div>
    <div class=tile>
      <div class=k>${t('diag.identity')}</div>
      <div class='sub mono'>BT   ${chip.mac_bt||'-'}</div>
      <div class='sub mono'>WiFi ${chip.mac_wifi||'-'}</div>
      <div class='sub mono'>${chip.mdns||'-'}.local</div>
    </div>
    <div class=tile>
      <div class=k>${t('diag.boot_runtime')}</div>
      <div class=v>${m.boot_count||0}<span class=u>${t('diag.boots')}</span></div>
      <div class=sub>${t('diag.total')} ${fmtDur(m.total_uptime_s||0)}</div>
      <div class=sub>${t('diag.current')} ${fmtDur(r.uptime_s||0)}</div>
    </div>
    <div class=tile>
      <div class=k>${t('diag.ram')}</div>
      <div class=v>${fmtBytes(heap.free)}<span class=u>${t('diag.free')}</span></div>
      <div class=sub>${t('diag.min_free')} ${fmtBytes(heap.min_free)}</div>
      <div class=sub>${t('diag.largest')} ${fmtBytes(heap.largest_free)}</div>
    </div>
    <div class=tile>
      <div class=k>${t('diag.disk')}</div>
      <div class=v>${fmtBytes(fs.used)}<span class=u>/ ${fmtBytes(fs.total)}</span></div>
      <div class=barwrap><div class='bar ${fsCls}' style='width:${fsPct}%'></div></div>
      <div class=sub>${t('diag.events_file')} ${fmtBytes(fs.events_file_bytes)} <span class=t-mute>/ ${fmtBytes(r.events_retention?.max_bytes_cap||0)}</span></div>
      <div class=sub>${t('diag.retention',r.events_retention?.retention_days||0)}</div>
    </div>
    <div class=tile>
      <div class=k>${t('diag.ota_slot')}</div>
      ${(ota.slots||[]).map(s=>{
        const tag = s.running?`<span class=t-pos style='font-size:10px'>● ${t('diag.running')}</span>`
                  : s.next   ?`<span class=t-mute style='font-size:10px'>○ ${t('diag.next_slot')}</span>` : '';
        return `<div class='sub mono' style='display:flex;justify-content:space-between;gap:8px'>
          <span>${s.label} <span class=t-mute>${s.version||'—'}</span></span>
          <span>${tag}</span>
        </div>`;
      }).join('')}
    </div>`;
}

async function loadLogs(){
  const box=$('logsBox');if(!box)return;
  try{
    const r=await fetch('/api/system/logs',{cache:'no-store'});
    if(!r.ok){box.textContent=t('common.load_failed');return;}
    let txt=await r.text();
    // ESP_LOG colorises every line with ANSI escapes (e.g. \x1b[0;32m … \x1b[0m).
    // Strip them — <pre> renders the literal "[0;32m" otherwise.
    txt = txt.replace(/\x1b\[[0-9;]*m/g, '');
    box.textContent=txt.length?txt:t('logs.empty');
    box.scrollTop=box.scrollHeight;
  }catch(_){box.textContent=t('common.load_failed');}
}

function waitForReboot(){
  const m=$('main');
  m.innerHTML=`<div class=ph><h1>${t('system.reboot_title')}</h1><div class=desc>${t('system.reboot_waiting')}</div></div>`;
  let n=0;
  const iv=setInterval(async()=>{n++;
    try{const r=await fetch('/api/system/status',{cache:'no-store'});
      if(r.ok){clearInterval(iv);await refreshStatus();await refreshAuth();render();}}catch(_){}
    if(n>120){clearInterval(iv);m.innerHTML+=`<div class=t-neg>${t('system.reboot_timeout')}</div>`;}
  },2500);
}
